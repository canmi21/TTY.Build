name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# This repository is public, so these jobs run untrusted pull request code:
# keep them on GitHub-hosted runners and never give them secrets.
# Job names are required status checks; renaming one blocks merges until
# branch protection is updated to match.
jobs:
  relay:
    name: relay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Node and Worker tests
        run: npm test

      - name: Bundle Worker without deploying
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run deploy:dry-run

  desktop:
    name: desktop
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test shared protocol kit
        run: swift test --package-path shared/TTYBuildKit

      - name: Test daemon and CLI
        run: swift test --package-path desktop/TTYBuildDaemon

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build menu bar app (unsigned)
        working-directory: desktop/TTYBuildMenubar
        run: |
          xcodegen generate
          xcodebuild \
            -project TTYBuildMenubar.xcodeproj \
            -scheme TTYBuildMenubar \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-menubar" \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios:
    name: ios
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Pick the newest iPhone runtime that is at least the iOS 26 deployment
      # target and no newer than the active Xcode's simulator SDK.
      - name: Boot iPhone simulator
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          selection="$(xcrun simctl list devices available --json | jq -r --arg sdk "$sdk" '
            def ver: split(".") | map(tonumber) | (. + [0, 0])[0:2];
            ($sdk | ver) as $max
            | [ .devices
                | to_entries[]
                | select(.key | test("SimRuntime\\.iOS-[0-9]+-[0-9]+$"))
                | (.key | capture("iOS-(?<v>[0-9]+-[0-9]+)$").v | gsub("-"; ".") | ver) as $v
                | select($v >= [26, 0] and $v <= $max)
                | .value[]
                | select(.name | startswith("iPhone"))
                | {v: $v, udid, name}
              ]
            | sort_by(.v)
            | last
            | if . == null then empty
              else "\(.udid)\t\(.name)\tiOS \(.v | map(tostring) | join("."))"
              end')"
          if [[ -z "$selection" ]]; then
            echo "No available iPhone simulator runs iOS 26 or newer within the iOS $sdk SDK." >&2
            xcrun simctl list runtimes >&2
            exit 1
          fi
          IFS=$'\t' read -r udid name runtime <<< "$selection"
          echo "Using $name ($runtime, $udid) with the iOS $sdk simulator SDK"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          echo "TTYBUILD_IOS_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build and test iPhone, widget, and Watch targets
        run: |
          xcodebuild \
            -project ios/TTYBuild.xcodeproj \
            -scheme TTYBuild \
            -destination "platform=iOS Simulator,id=$TTYBUILD_IOS_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            -parallel-testing-enabled NO \
            test
